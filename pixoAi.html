<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXO AI</title>

<style>

*{
    box-sizing:border-box;
    font-family:system-ui, Arial;
}

body{
    margin:0;
    background:#0b0f19;
    color:white;
    display:flex;
    height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:260px;
    background:#111827;
    padding:15px;
    display:flex;
    flex-direction:column;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#38bdf8;
    margin-bottom:20px;
}

.newchat{
    padding:10px;
    background:#1f2937;
    border-radius:10px;
    text-align:center;
    cursor:pointer;
    margin-bottom:10px;
}

.history{
    flex:1;
    overflow:auto;
    font-size:14px;
    opacity:0.8;
}

/* MAIN CHAT */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

.chat{
    flex:1;
    padding:20px;
    overflow:auto;
}

.msg{
    max-width:700px;
    margin:10px auto;
    padding:12px 15px;
    border-radius:12px;
    line-height:1.4;
}

.user{
    background:#1d4ed8;
    align-self:flex-end;
}

.bot{
    background:#1f2937;
}

/* INPUT */
.inputbar{
    display:flex;
    padding:15px;
    background:#111827;
}

input{
    flex:1;
    padding:14px;
    border:none;
    border-radius:10px;
    outline:none;
    background:#1f2937;
    color:white;
}

button{
    margin-left:10px;
    padding:14px 18px;
    border:none;
    border-radius:10px;
    background:#38bdf8;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0ea5e9;
}

</style>
</head>
<body>

<div class="sidebar">
    <div class="logo">⚡ PIXO AI</div>
    <div class="newchat" onclick="clearChat()">+ New Chat</div>
    <div class="history">Chat History (local)</div>
</div>

<div class="main">

    <div class="chat" id="chat"></div>

    <div class="inputbar">
        <input id="input" placeholder="Message PIXO AI..." />
        <button onclick="send()">Send</button>
    </div>

</div>

<script type="module">

import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

const API_KEY = "AIzaSyCKJ2jQPqUOil258UqbtObjgMtefWxYF6Q";

const genAI = new GoogleGenerativeAI(API_KEY);
const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash" });

const chat = document.getElementById("chat");

function addMsg(text, type){
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

window.send = async function(){

    const input = document.getElementById("input");
    const text = input.value;

    if(!text) return;

    addMsg("You: " + text, "user");
    input.value = "";

    try{
        const result = await model.generateContent(
            `You are PIXO AI like ChatGPT. Be smart, helpful and natural. User: ${text}`
        );

        const response = await result.response;
        addMsg("PIXO: " + response.text(), "bot");

    }catch(e){
        addMsg("Error: " + e, "bot");
    }
}

window.clearChat = function(){
    chat.innerHTML = "";
}

</script>

</body>
</html>
